name: Release proof

on: workflow_dispatch

permissions: {}

jobs:
  proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: release-please
    permissions: {}
    steps:
      - id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
      - name: Create, read back and delete a proof tag
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          GH_REPO: ${{ github.repository }}
          TARGET: ${{ github.sha }}
        run: |
          set -euo pipefail
          ref=refs/tags/v0.0.0-proof
          gh api --method POST "repos/$GH_REPO/git/refs" -f "ref=$ref" -f "sha=$TARGET"
          found="$(gh api "repos/$GH_REPO/git/ref/tags/v0.0.0-proof" --jq .object.sha)"
          if [ "$found" != "$TARGET" ]; then
            echo "proof tag points at $found, expected $TARGET" >&2
            exit 1
          fi
          gh api --method DELETE "repos/$GH_REPO/git/refs/tags/v0.0.0-proof"
          echo "created, read back and deleted $ref at $TARGET"
